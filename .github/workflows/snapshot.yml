name: Daily snapshot

on:
  schedule:
    # Every hour at :47; the gate step only lets the run through during the 9–11pm hours
    # of your current time zone (see "travel" in data/config.json).
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Is it evening where you are?
        id: gate
        run: node scripts/should-snapshot.mjs
      - name: Record today's WaniKani numbers
        if: steps.gate.outputs.go == 'true'
        env:
          WANIKANI_TOKEN: ${{ secrets.WANIKANI_TOKEN }}
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
        run: node scripts/snapshot.mjs
      - name: Pull new podcast episodes
        if: steps.gate.outputs.go == 'true'
        continue-on-error: true
        run: node scripts/feeds.mjs
      - name: Commit
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "japanese-hub bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/wk-state.json data/wk-vocab.json
          [ -f data/grammar-progress.json ] && git add data/grammar-progress.json
          git add data/immersion
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "Snapshot $(date -u +%F)"
          git push
