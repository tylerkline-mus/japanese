name: Check lessons

on:
  push:
    paths:
      - "data/lessons/**"
      - "scripts/validate-lessons.mjs"
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-lessons.mjs
